<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Jergan.extra - Code with Blocks or Scripts</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: sans-serif;
      background: #f7f7f7;
    }
    #age-picker, #main-editor {
      height: 100%;
    }
    #age-picker {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .btn {
      padding: 12px 20px;
      margin: 10px;
      font-size: 18px;
      cursor: pointer;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 8px;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #2563eb;
    }
    #main-container {
      display: flex;
      height: 100%;
    }
    #blocklyDiv {
      height: 100%;
      width: 60%;
    }
    #right-panel {
      width: 40%;
      display: flex;
      flex-direction: column;
      padding: 10px;
      box-sizing: border-box;
      background: #fff;
      border-left: 2px solid #ddd;
    }
    #sprite-buttons {
      margin-bottom: 10px;
    }
    #sprite-buttons button {
      margin-right: 5px;
      padding: 8px 12px;
    }
    #stage {
      flex: 1;
      background: #e0e0e0;
      border: 2px solid #ccc;
      position: relative;
      overflow: hidden;
    }
    canvas {
      background: white;
      border-radius: 10px;
      border: 1px solid #999;
    }
    #script-editor {
      display: none;
      height: 150px;
      background: #f0f0f0;
      overflow: auto;
      font-family: monospace;
      padding: 10px;
    }
  </style>
  <script src="https://unpkg.com/blockly/blockly.min.js"></script>
</head>
<body>

<!-- Age Picker -->
<div id="age-picker">
  <h1>Welcome to Jergan.extra</h1>
  <p>Choose your mode:</p>
  <button class="btn" onclick="startMode('young')">I'm under 13 (Blocks only)</button>
  <button class="btn" onclick="startMode('teen')">I'm 13 or older (Blocks + Script)</button>
</div>

<!-- Main Editor -->
<div id="main-editor" style="display:none;">
  <div id="main-container">
    <div id="blocklyDiv"></div>
    <div id="right-panel">
      <div id="sprite-buttons">
        <button onclick="addSprite()">Add Sprite</button>
        <button onclick="deleteSprite()">Delete Sprite</button>
        <button onclick="drawSprite()">Draw Sprite</button>
      </div>
      <canvas id="stage" width="400" height="300"></canvas>
      <button class="btn" onclick="generateCode()">Generate Code</button>
      <button class="btn" onclick="runCode()">Run</button>
      <button class="btn" onclick="stopCode()">Stop</button>
      <pre id="script-editor"></pre>
    </div>
  </div>
</div>

<!-- SCRIPT -->
<script>
window.addEventListener("DOMContentLoaded", () => {
  let workspace = null;
  let currentMode = 'young';
  let sprites = [];
  let selectedSprite = null;
  let ctx = null;
  let running = false;

  // Initialize Blockly
  function initBlockly() {
    const toolbox = `
      <xml>
        <category name="Events" colour="#FFBF00">
          <block type="event_whenflagclicked"></block>
        </category>
        <category name="Sprites" colour="#FF6699">
          <block type="sprite_move"></block>
          <block type="sprite_say"></block>
        </category>
        <category name="Looks" colour="#9966FF">
          <block type="sprite_setvisible"></block>
        </category>
        <category name="Motion" colour="#4C97FF">
          <block type="move_steps"></block>
        </category>
        <category name="Text" colour="#5CA6A6">
          <block type="text"></block>
        </category>
      </xml>
    `;

    workspace = Blockly.inject('blocklyDiv', {
      toolbox: toolbox,
      trashcan: true,
      zoom: { controls: true, wheel: true }
    });

    // Custom Blocks
    Blockly.defineBlocksWithJsonArray([
      {
        "type": "event_whenflagclicked",
        "message0": "when flag clicked",
        "nextStatement": null,
        "colour": 60
      },
      {
        "type": "sprite_move",
        "message0": "move %1 steps",
        "args0": [{"type": "input_value", "name": "STEPS", "check": "Number"}],
        "previousStatement": null,
        "nextStatement": null,
        "colour": 290
      },
      {
        "type": "sprite_say",
        "message0": "say %1",
        "args0": [{"type": "input_value", "name": "TEXT"}],
        "previousStatement": null,
        "nextStatement": null,
        "colour": 160
      },
      {
        "type": "sprite_setvisible",
        "message0": "set visible %1",
        "args0": [{"type": "field_checkbox", "name": "VISIBLE", "checked": true}],
        "previousStatement": null,
        "nextStatement": null,
        "colour": 230
      },
      {
        "type": "move_steps",
        "message0": "move %1 steps",
        "args0": [{"type": "input_value", "name": "STEPS", "check": "Number"}],
        "previousStatement": null,
        "nextStatement": null,
        "colour": 210
      }
    ]);

    Blockly.JavaScript['event_whenflagclicked'] = function() {
      return '/* When flag clicked */\n';
    };
    Blockly.JavaScript['sprite_move'] = function(block) {
      const steps = Blockly.JavaScript.valueToCode(block, 'STEPS', Blockly.JavaScript.ORDER_ATOMIC) || 10;
      return `moveSprite(${steps});\n`;
    };
    Blockly.JavaScript['sprite_say'] = function(block) {
      const msg = Blockly.JavaScript.valueToCode(block, 'TEXT', Blockly.JavaScript.ORDER_ATOMIC) || '""';
      return `spriteSay(${msg});\n`;
    };
    Blockly.JavaScript['sprite_setvisible'] = function(block) {
      const visible = block.getFieldValue('VISIBLE') === 'TRUE';
      return `setVisible(${visible});\n`;
    };
    Blockly.JavaScript['move_steps'] = function(block) {
      const steps = Blockly.JavaScript.valueToCode(block, 'STEPS', Blockly.JavaScript.ORDER_ATOMIC) || 10;
      return `moveSprite(${steps});\n`;
    };
  }

  // Mode switch
  window.startMode = function(mode) {
    currentMode = mode;
    document.getElementById('age-picker').style.display = 'none';
    document.getElementById('main-editor').style.display = 'block';
    initBlockly();
    ctx = document.getElementById('stage').getContext('2d');
    addSprite();
    if (mode === 'teen') document.getElementById('script-editor').style.display = 'block';
  };

  // Sprite logic
  function drawAllSprites() {
    ctx.clearRect(0, 0, 400, 300);
    for (let s of sprites) {
      if (!s.visible) continue;
      ctx.beginPath();
      ctx.arc(s.x, s.y, 20, 0, Math.PI * 2);
      ctx.fillStyle = s.color;
      ctx.fill();
    }
  }

  window.addSprite = function() {
    const colors = ["#ff9900", "#33cc33", "#0099ff", "#ff33cc"];
    const sprite = { x: 200, y: 150, color: colors[sprites.length % colors.length], visible: true };
    sprites.push(sprite);
    selectedSprite = sprite;
    drawAllSprites();
  };

  window.deleteSprite = function() {
    if (selectedSprite) {
      sprites = sprites.filter(s => s !== selectedSprite);
      selectedSprite = null;
      drawAllSprites();
    }
  };

  window.drawSprite = function() {
    alert("🖌️ Sprite drawing tool coming soon!");
  };

  // Blockly runtime
  window.generateCode = function() {
    const code = Blockly.JavaScript.workspaceToCode(workspace);
    if (currentMode === 'teen') document.getElementById('script-editor').textContent = code;
    console.log(code);
  };

  window.runCode = function() {
    running = true;
    const code = Blockly.JavaScript.workspaceToCode(workspace);
    try {
      eval(code);
    } catch (e) {
      alert("Error: " + e.message);
    }
  };

  window.stopCode = function() {
    running = false;
  };

  // Sprite actions
  window.moveSprite = function(steps) {
    if (selectedSprite) {
      selectedSprite.x += steps;
      drawAllSprites();
    }
  };

  window.spriteSay = function(text) {
    if (selectedSprite) alert("Sprite says: " + text);
  };

  window.setVisible = function(visible) {
    if (selectedSprite) {
      selectedSprite.visible = visible;
      drawAllSprites();
    }
  };
});
</script>

</body>
</html>
