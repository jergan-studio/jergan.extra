<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Jergan.extra - Code with Blocks or Scripts</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; font-family: sans-serif; }
    #age-picker, #main-editor { display: none; height: 100%; }
    #age-picker { display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .btn { padding: 12px 20px; margin: 10px; font-size: 18px; cursor: pointer; }
    #main-container { display: flex; height: 100%; }
    #blocklyDiv { height: 100%; width: 60%; }
    #right-panel { width: 40%; display: flex; flex-direction: column; padding: 10px; box-sizing: border-box; }
    #editor-container { flex: 1; display: flex; flex-direction: column; }
    #script-editor { display: none; height: 200px; font-family: monospace; white-space: pre; padding: 10px; background: #f0f0f0; border: 1px solid #ccc; overflow: auto; }
    #output { height: 150px; background: #111; color: #0f0; padding: 10px; font-family: monospace; overflow: auto; }
    button { margin-top: 10px; padding: 8px 12px; }
  </style>
  <script src="https://unpkg.com/blockly/blockly.min.js"></script>
  <script src="https://unpkg.com/interpreter@latest/interpreter.js"></script>
</head>
<body>

<!-- Age Picker Screen -->
<div id="age-picker">
  <h1>Welcome to Jergan.extra</h1>
  <p>Choose your mode:</p>
  <button class="btn" onclick="startMode('young')">I'm under 13 (Blocks only)</button>
  <button class="btn" onclick="startMode('teen')">I'm 13 or older (Blocks + Script)</button>
</div>

<!-- Main Editor UI -->
<div id="main-editor">
  <div id="main-container">
    <div id="blocklyDiv"></div>
    <div id="right-panel">
      <div id="editor-container">
        <button onclick="generateCode()">Generate Code</button>
        <button onclick="runCode()">Run</button>
        <button onclick="stopCode()">Stop</button>
        <pre id="script-editor"></pre>
      </div>
      <h3>Output</h3>
      <pre id="output"></pre>
    </div>
  </div>
</div>

<script>
  let workspace = null;
  let currentMode = 'young';
  let interpreter = null;
  let runTimer = null;

  function startMode(mode) {
    currentMode = mode;
    document.getElementById('age-picker').style.display = 'none';
    document.getElementById('main-editor').style.display = 'block';
    initBlockly();
    if (mode === 'teen') {
      document.getElementById('script-editor').style.display = 'block';
    }
  }

  function initBlockly() {
    const toolbox = `
      <xml>
        <category name="Logic" colour="#5C81A6">
          <block type="controls_if"></block>
        </category>
        <category name="Loops" colour="#5CA65C">
          <block type="controls_repeat_ext">
            <value name="TIMES"><shadow type="math_number"><field name="NUM">3</field></shadow></value>
          </block>
        </category>
        <category name="Math" colour="#5C68A6">
          <block type="math_number"><field name="NUM">0</field></block>
          <block type="math_arithmetic"></block>
        </category>
        <category name="Text" colour="#5CA6A6">
          <block type="text"></block>
          <block type="text_print"></block>
        </category>
      </xml>
    `;
    workspace = Blockly.inject('blocklyDiv', {
      toolbox: toolbox,
      trashcan: true,
      zoom: { controls: true, wheel: true }
    });

    // Load a starter block
    const xmlText = `
      <xml xmlns="https://developers.google.com/blockly/xml">
        <block type="text_print" x="10" y="10">
          <value name="TEXT">
            <shadow type="text">
              <field name="TEXT">Welcome to Jergan.extra!</field>
            </shadow>
          </value>
        </block>
      </xml>`;
    const xml = Blockly.Xml.textToDom(xmlText);
    Blockly.Xml.domToWorkspace(xml, workspace);
  }

  function generateCode() {
    const jsCode = Blockly.JavaScript.workspaceToCode(workspace);
    if (currentMode === 'teen') {
      document.getElementById('script-editor').textContent = jsCode;
    }
  }

  function initApi(interpreter, globalObject) {
    const wrapper = function(text) {
      text = text ? text.toString() : '';
      document.getElementById('output').textContent += text + '\n';
    };
    interpreter.setProperty(globalObject, 'print', interpreter.createNativeFunction(wrapper));
  }

  function runCode() {
    clearOutput();
    const code = Blockly.JavaScript.workspaceToCode(workspace);
    try {
      interpreter = new Interpreter(code, initApi);
    } catch (err) {
      logOutput("Error parsing code: " + err.message);
      return;
    }

    let steps = 0;
    const MAX_STEPS = 100000;

    function nextStep() {
      try {
        if (interpreter && interpreter.step()) {
          steps++;
          if (steps > MAX_STEPS) {
            logOutput("Execution stopped: too many steps.");
            return;
          }
          runTimer = setTimeout(nextStep, 0);
        } else {
          logOutput("Program finished.");
        }
      } catch (e) {
        logOutput("Runtime error: " + e.message);
      }
    }
    nextStep();
  }

  function stopCode() {
    if (runTimer) clearTimeout(runTimer);
    interpreter = null;
    logOutput("Execution stopped.");
  }

  function clearOutput() {
    document.getElementById('output').textContent = '';
  }

  function logOutput(msg) {
    const out = document.getElementById('output');
    out.textContent += msg + '\n';
    out.scrollTop = out.scrollHeight;
  }
</script>

</body>
</html>
