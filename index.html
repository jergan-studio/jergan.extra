<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Jergan.extra - Create & Code</title>
  <style>
    html, body {
      margin: 0; padding: 0; height: 100%;
      font-family: sans-serif; background: #fafafa;
    }
    #age-picker, #main-editor { display: none; height: 100%; }
    #age-picker {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
    }
    .btn { padding: 12px 20px; margin: 10px; font-size: 18px; cursor: pointer;
      border-radius: 8px; border: none; background: #007bff; color: white; }
    #main-container { display: flex; height: 100%; }
    #blocklyDiv { height: 100%; width: 60%; background: #ffffff; border-right: 2px solid #ccc; }
    #right-panel {
      width: 40%; display: flex; flex-direction: column; padding: 10px;
      box-sizing: border-box; background: #f0f0f0;
    }
    #script-editor {
      display: none; height: 150px; background: #f8f8f8; border: 1px solid #ccc;
      font-family: monospace; padding: 10px; overflow: auto; border-radius: 6px;
    }
    #stage {
      width: 100%; height: 300px; border: 2px solid #333;
      background: #d0ebff; border-radius: 10px; margin-top: 10px;
    }
    #sprite-buttons button {
      margin: 5px; padding: 8px 14px; border: none; border-radius: 6px;
      background: #333; color: white; cursor: pointer;
    }
    #draw-canvas {
      display: none; margin-top: 10px; border: 2px dashed #999;
      background: #fff;
    }
  </style>
  <script src="https://unpkg.com/blockly/blockly.min.js"></script>
  <script src="https://unpkg.com/interpreter@latest/interpreter.js"></script>
</head>
<body>

<!-- Age picker -->
<div id="age-picker">
  <h1>Welcome to Jergan.extra</h1>
  <p>Choose your mode:</p>
  <button class="btn" onclick="startMode('young')">Under 13 (Blocks)</button>
  <button class="btn" onclick="startMode('teen')">13+ (Blocks + Script)</button>
</div>

<!-- Main editor -->
<div id="main-editor">
  <div id="main-container">
    <div id="blocklyDiv"></div>
    <div id="right-panel">
      <button onclick="generateCode()">Generate Code</button>
      <button onclick="runCode()">Run</button>
      <button onclick="stopCode()">Stop</button>
      <pre id="script-editor"></pre>

      <div id="sprite-buttons">
        <button onclick="addSprite()">➕ Add Sprite</button>
        <button onclick="deleteSprite()">❌ Delete Sprite</button>
        <button onclick="toggleDrawCanvas()">✏️ Draw Sprite</button>
      </div>

      <canvas id="stage" width="300" height="300"></canvas>
      <canvas id="draw-canvas" width="200" height="200"></canvas>
    </div>
  </div>
</div>
