<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Jergan.extra - Create & Code</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; font-family: sans-serif; }
    #age-picker, #main-editor { display: none; height: 100%; }
    #age-picker { display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .btn { padding: 12px 20px; margin: 10px; font-size: 18px; cursor: pointer; }
    #main-container { display: flex; height: 100%; }
    #blocklyDiv { height: 100%; width: 60%; background: #fafafa; }
    #right-panel { width: 40%; display: flex; flex-direction: column; padding: 10px; box-sizing: border-box; }
    #script-editor { display: none; height: 200px; font-family: monospace; white-space: pre; padding: 10px; background: #f0f0f0; border: 1px solid #ccc; overflow: auto; }
    #output { height: 150px; background: #111; color: #0f0; padding: 10px; font-family: monospace; overflow: auto; }
    canvas { background: #d0ebff; border: 1px solid #aaa; margin-top: 10px; }
    button { margin-top: 10px; padding: 8px 12px; }
  </style>
  <script src="https://unpkg.com/blockly/blockly.min.js"></script>
  <script src="https://unpkg.com/interpreter@latest/interpreter.js"></script>
</head>
<body>

<!-- Mode Selector -->
<div id="age-picker">
  <h1>Welcome to Jergan.extra</h1>
  <p>Choose your mode:</p>
  <button class="btn" onclick="startMode('young')">Under 13 (Blocks)</button>
  <button class="btn" onclick="startMode('teen')">13+ (Blocks + Script)</button>
</div>

<!-- Main Editor -->
<div id="main-editor">
  <div id="main-container">
    <div id="blocklyDiv"></div>
    <div id="right-panel">
      <button onclick="generateCode()">Generate Code</button>
      <button onclick="runCode()">Run</button>
      <button onclick="stopCode()">Stop</button>
      <pre id="script-editor"></pre>
      <h3>Output</h3>
      <pre id="output"></pre>
      <canvas id="stage" width="300" height="300"></canvas>
    </div>
  </div>
</div>

<script>
  let workspace, interpreter, currentMode = 'young', runTimer;
  const stage = document.getElementById('stage');
  const ctx = stage.getContext('2d');
  const sprites = { cat: { x: 150, y: 150, visible: true, color: '#ff8800' } };

  // draw sprite on canvas
  function drawStage() {
    ctx.clearRect(0, 0, stage.width, stage.height);
    for (let name in sprites) {
      const s = sprites[name];
      if (s.visible) {
        ctx.fillStyle = s.color;
        ctx.beginPath();
        ctx.arc(s.x, s.y, 20, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  function startMode(mode) {
    currentMode = mode;
    document.getElementById('age-picker').style.display = 'none';
    document.getElementById('main-editor').style.display = 'block';
    initBlockly();
    if (mode === 'teen') document.getElementById('script-editor').style.display = 'block';
    drawStage();
  }

  function initBlockly() {
    const toolbox = `
      <xml>
        <category name="Events" colour="#FFBF00">
          <block type="event_when_flag_clicked"></block>
        </category>
        <category name="Sprites" colour="#FF7F00">
          <block type="sprite_move"></block>
          <block type="sprite_turn"></block>
          <block type="sprite_show"></block>
          <block type="sprite_hide"></block>
        </category>
        <category name="Looks" colour="#9966FF">
          <block type="looks_say"></block>
        </category>
        <category name="Messages" colour="#FF4C4C">
          <block type="messages_broadcast"></block>
        </category>
        <category name="Sensing" colour="#4C97FF">
          <block type="sensing_mousex"></block>
          <block type="sensing_mousey"></block>
        </category>
        <category name="Control" colour="#FFAB19">
          <block type="controls_repeat_ext">
            <value name="TIMES"><shadow type="math_number"><field name="NUM">5</field></shadow></value>
          </block>
        </category>
        <category name="Text" colour="#5CA6A6">
          <block type="text_print"></block>
        </category>
      </xml>
    `;

    workspace = Blockly.inject('blocklyDiv', { toolbox, trashcan: true });

    // Custom Blocks
    Blockly.defineBlocksWithJsonArray([
      { type: "event_when_flag_clicked", message0: "when flag clicked", nextStatement: null, colour: "#FFBF00" },
      { type: "sprite_move", message0: "move %1 steps", args0: [{ type: "input_value", name: "STEPS" }], previousStatement: null, nextStatement: null, colour: "#FF7F00" },
      { type: "sprite_turn", message0: "turn %1 degrees", args0: [{ type: "input_value", name: "DEGREES" }], previousStatement: null, nextStatement: null, colour: "#FF7F00" },
      { type: "sprite_show", message0: "show sprite", previousStatement: null, nextStatement: null, colour: "#FF7F00" },
      { type: "sprite_hide", message0: "hide sprite", previousStatement: null, nextStatement: null, colour: "#FF7F00" },
      { type: "looks_say", message0: "say %1", args0: [{ type: "input_value", name: "TEXT" }], previousStatement: null, nextStatement: null, colour: "#9966FF" },
      { type: "messages_broadcast", message0: "broadcast message %1", args0: [{ type: "input_value", name: "MSG" }], previousStatement: null, nextStatement: null, colour: "#FF4C4C" },
      { type: "sensing_mousex", message0: "mouse x", output: "Number", colour: "#4C97FF" },
      { type: "sensing_mousey", message0: "mouse y", output: "Number", colour: "#4C97FF" },
    ]);

    // Generators
    Blockly.JavaScript['sprite_move'] = b => `moveSprite('cat', ${Blockly.JavaScript.valueToCode(b, 'STEPS', Blockly.JavaScript.ORDER_NONE) || 10});\n`;
    Blockly.JavaScript['sprite_turn'] = b => `turnSprite('cat', ${Blockly.JavaScript.valueToCode(b, 'DEGREES', Blockly.JavaScript.ORDER_NONE) || 15});\n`;
    Blockly.JavaScript['sprite_show'] = () => `setSpriteVisible('cat', true);\n`;
    Blockly.JavaScript['sprite_hide'] = () => `setSpriteVisible('cat', false);\n`;
    Blockly.JavaScript['looks_say'] = b => `say(${Blockly.JavaScript.valueToCode(b, 'TEXT', Blockly.JavaScript.ORDER_NONE) || '"Hello!"'});\n`;
    Blockly.JavaScript['sensing_mousex'] = () => `mouseX`;
    Blockly.JavaScript['sensing_mousey'] = () => `mouseY`;
    Blockly.JavaScript['messages_broadcast'] = b => `broadcast(${Blockly.JavaScript.valueToCode(b, 'MSG', Blockly.JavaScript.ORDER_NONE)});\n`;
    Blockly.JavaScript['event_when_flag_clicked'] = b => `// when flag clicked\n`;

    const xml = Blockly.Xml.textToDom(`
      <xml>
        <block type="event_when_flag_clicked" x="10" y="10"></block>
      </xml>
    `);
    Blockly.Xml.domToWorkspace(xml, workspace);
  }

  function generateCode() {
    const js = Blockly.JavaScript.workspaceToCode(workspace);
    if (currentMode === 'teen') document.getElementById('script-editor').textContent = js;
  }

  function initApi(interpreter, globalObject) {
    const output = msg => logOutput(msg);
    interpreter.setProperty(globalObject, 'print', interpreter.createNativeFunction(output));
    interpreter.setProperty(globalObject, 'moveSprite', interpreter.createNativeFunction((name, steps) => {
      sprites[name].x += steps;
      drawStage();
    }));
    interpreter.setProperty(globalObject, 'setSpriteVisible', interpreter.createNativeFunction((name, vis) => {
      sprites[name].visible = vis;
      drawStage();
    }));
    interpreter.setProperty(globalObject, 'say', interpreter.createNativeFunction(text => logOutput('Sprite says: ' + text)));
    interpreter.setProperty(globalObject, 'broadcast', interpreter.createNativeFunction(msg => logOutput('Broadcast: ' + msg)));
    interpreter.setProperty(globalObject, 'mouseX', 150);
    interpreter.setProperty(globalObject, 'mouseY', 150);
  }

  function runCode() {
    clearOutput();
    const code = Blockly.JavaScript.workspaceToCode(workspace);
    try {
      interpreter = new Interpreter(code, initApi);
      step();
    } catch (err) {
      logOutput('Error: ' + err.message);
    }
  }

  function step() {
    if (!interpreter) return;
    if (interpreter.run()) {
      runTimer = setTimeout(step, 0);
    } else {
      logOutput('Program finished.');
    }
  }

  function stopCode() {
    clearTimeout(runTimer);
    interpreter = null;
    logOutput('Execution stopped.');
  }

  function logOutput(msg) {
    const out = document.getElementById('output');
    out.textContent += msg + '\n';
    out.scrollTop = out.scrollHeight;
  }

  function clearOutput() {
    document.getElementById('output').textContent = '';
  }
</script>

</body>
</html>
