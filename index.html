<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Jergan.extra (cloud-save ready)</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    html,body{height:100%;margin:0;font-family:sans-serif;background:#f3f4f6}
    #toolbar{display:flex;gap:8px;padding:10px;background:#fff;border-bottom:1px solid #e5e7eb;align-items:center}
    button{padding:8px 12px;border-radius:8px;border:1px solid #ccc;background:#fff;cursor:pointer}
    #container{display:flex;height:calc(100% - 56px)}
    #blocklyDiv{width:60%;height:100%}
    #right{width:40%;padding:12px;box-sizing:border-box;background:#fff;display:flex;flex-direction:column;gap:8px}
    #stageWrap{flex:1;border:1px solid #ddd;border-radius:8px;overflow:hidden;background:#cfe9ff;position:relative}
    #stage{display:block;background:transparent}
    select,input[type=file]{padding:6px}
    #draw-modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center}
    #draw-area{background:#fff;padding:12px;border-radius:8px;text-align:center}
    pre#script{height:140px;overflow:auto;background:#f8fafc;padding:8px;border-radius:6px;border:1px solid #e6eef7}
    .muted{color:#6b7280;font-size:13px}
  </style>
  <script src="https://unpkg.com/blockly/blockly.min.js"></script>
</head>
<body>

<div id="toolbar">
  <div id="mode-picker">
    <button id="btn-young">Under 13 (Blocks)</button>
    <button id="btn-teen">13+ (Blocks + Script)</button>
  </div>

  <div style="margin-left:12px" class="muted">Project URL: <span id="projectUrl">—</span></div>

  <div style="margin-left:auto;display:flex;gap:8px">
    <button id="btn-save-cloud">Save to Cloud</button>
    <button id="btn-load-cloud">Load from Cloud</button>
    <button id="btn-export">Export JSON</button>
    <input id="importFile" type="file" accept="application/json" style="display:none">
    <button id="btn-import">Import JSON</button>
  </div>
</div>

<div id="container">
  <div id="blocklyDiv"></div>

  <div id="right">
    <div style="display:flex;gap:8px;align-items:center">
      <button id="addSprite">Add Sprite</button>
      <button id="delSprite">Delete Sprite</button>
      <button id="openDraw">Draw Sprite</button>
      <select id="spriteSelect"></select>
    </div>

    <div id="stageWrap">
      <canvas id="stage" width="640" height="480"></canvas>
    </div>

    <div style="display:flex;gap:8px">
      <button id="gen">Generate Code</button>
      <button id="greenFlag">▶ Green Flag</button>
      <button id="run">Run</button>
      <button id="stop">Stop</button>
    </div>

    <pre id="script" style="display:none"></pre>
    <div class="muted">Tip: Use the toolbox to add event / motion / looks blocks. Use the green flag to run event handlers.</div>
  </div>
</div>

<!-- draw modal -->
<div id="draw-modal">
  <div id="draw-area">
    <h3>Draw Sprite</h3>
    <input type="color" id="colorPicker" value="#000000"><br><br>
    <canvas id="drawCanvas" width="200" height="200" style="border:1px solid #ccc;cursor:crosshair"></canvas><br><br>
    <button id="saveDraw">Save</button>
    <button id="cancelDraw">Cancel</button>
  </div>
</div>

<script>
/* ================= CONFIG =================
   If you have a cloud API, set CLOUD_API_BASE to its origin,
   e.g. "https://api.yourdomain.com" - the code expects:
     POST  /projects/:id   <- save (body JSON)
     GET   /projects/:id   <- load (returns JSON)
   Example small server code provided after this file.
*/
const CLOUD_API_BASE = ""; // <-- set to server origin if available, otherwise left blank
/* ========================================= */

(function(){
  // State
  let workspace, currentMode = 'young';
  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d');
  let sprites = []; // each: {name,x,y,dir,visible,imageDataURL?}
  let selectedIndex = null;
  let dragIndex = null, dragOffsetX=0, dragOffsetY=0;
  let flagHandlers = [];
  let runInterval = null;
  let projectId = null;
  let projectUrl = null;

  // DOM
  const btnYoung = document.getElementById('btn-young');
  const btnTeen = document.getElementById('btn-teen');
  const addBtn = document.getElementById('addSprite');
  const delBtn = document.getElementById('delSprite');
  const openDraw = document.getElementById('openDraw');
  const spriteSelect = document.getElementById('spriteSelect');
  const genBtn = document.getElementById('gen');
  const runBtn = document.getElementById('run');
  const stopBtn = document.getElementById('stop');
  const greenFlag = document.getElementById('greenFlag');
  const scriptPre = document.getElementById('script');
  const projectUrlEl = document.getElementById('projectUrl');

  const btnSaveCloud = document.getElementById('btn-save-cloud');
  const btnLoadCloud = document.getElementById('btn-load-cloud');
  const btnExport = document.getElementById('btn-export');
  const btnImport = document.getElementById('btn-import');
  const importFile = document.getElementById('importFile');

  // Drawing modal
  const drawModal = document.getElementById('draw-modal');
  const drawCanvas = document.getElementById('drawCanvas');
  const drawCtx = drawCanvas.getContext('2d');
  document.getElementById('saveDraw').addEventListener('click', saveDrawing);
  document.getElementById('cancelDraw').addEventListener('click', ()=> drawModal.style.display='none');

  // Utils
  function randId(len=6){ return Math.random().toString(36).slice(2,2+len); }
  function updateProjectUrlDisplay(){ projectUrlEl.textContent = projectUrl || '—'; }

  // MODE buttons
  btnYoung.addEventListener('click', ()=> startMode('young'));
  btnTeen.addEventListener('click', ()=> startMode('teen'));

  function startMode(mode){
    currentMode = mode;
    document.getElementById('mode-picker').style.display='none';
    document.getElementById('container').style.display='flex';
    initBlockly();
    // add starter sprite (scratch avatar). if already loaded from saved project do not duplicate
    if(!projectId) {
      projectId = randId(6);
      projectUrl = `https://jergan-extra/${projectId}/.vercel.app/`;
      alert("Project created: " + projectUrl);
      updateProjectUrlDisplay();
      // try to load starter avatar
      const avatar = "https://uploads.scratch.mit.edu/users/avatars/jergan-studio.png";
      const img = new Image();
      img.crossOrigin = "anonymous";
      img.src = avatar;
      img.onload = () => {
        sprites.push({name:"Jergan", x:320, y:240, dir:90, visible:true, imageDataURL: imageToDataURL(img)});
        selectedIndex = sprites.length-1;
        refreshSpriteSelect();
        drawAll();
      };
      img.onerror = ()=> { addSprite(); };
    }
    if(mode === 'teen') scriptPre.style.display='block';
  }

  // Blockly init
  function initBlockly(){
    if(workspace) return;
    const toolbox = `
      <xml>
        <category name="Events" colour="#FFAB19">
          <block type="event_whenflagclicked"></block>
        </category>
        <category name="Motion" colour="#4C97FF">
          <block type="move_steps"></block>
          <block type="turn_right"></block>
          <block type="point_direction"></block>
        </category>
        <category name="Looks" colour="#9966FF">
          <block type="say_text"></block>
          <block type="set_visible"></block>
        </category>
        <category name="Control" colour="#FFBF00">
          <block type="controls_repeat_ext"></block>
        </category>
        <category name="Text" colour="#5CA6A6">
          <block type="text"></block>
        </category>
        <category name="Math" colour="#59C059">
          <block type="math_number"></block>
        </category>
      </xml>
    `;
    workspace = Blockly.inject('blocklyDiv',{toolbox,trashcan:true,zoom:{controls:true,wheel:true}});
    // define blocks
    Blockly.defineBlocksWithJsonArray([
      {"type":"event_whenflagclicked","message0":"when flag clicked","args0":[{"type":"input_statement","name":"DO"}],"colour":60},
      {"type":"move_steps","message0":"move %1 steps","args0":[{"type":"input_value","name":"STEPS","check":"Number"}],"previousStatement":null,"nextStatement":null,"colour":210},
      {"type":"turn_right","message0":"turn right %1 degrees","args0":[{"type":"input_value","name":"DEG","check":"Number"}],"previousStatement":null,"nextStatement":null,"colour":210},
      {"type":"point_direction","message0":"point in direction %1","args0":[{"type":"input_value","name":"DIR","check":"Number"}],"previousStatement":null,"nextStatement":null,"colour":210},
      {"type":"say_text","message0":"say %1","args0":[{"type":"input_value","name":"TEXT"}],"previousStatement":null,"nextStatement":null,"colour":270},
      {"type":"set_visible","message0":"set visible %1","args0":[{"type":"field_checkbox","name":"VIS","checked":true}],"previousStatement":null,"nextStatement":null,"colour":270}
    ]);

    // JavaScript generators
    Blockly.JavaScript['event_whenflagclicked'] = function(block){
      const statements = Blockly.JavaScript.statementToCode(block,'DO');
      const fnName = 'flagHandler_' + block.id.replace(/[^a-z0-9]/ig,'_');
      return `function ${fnName}(){\n${statements}\n}\nregisterFlagHandler(${fnName});\n`;
    };
    Blockly.JavaScript['move_steps'] = b=>{
      const steps = Blockly.JavaScript.valueToCode(b,'STEPS',Blockly.JavaScript.ORDER_ATOMIC) || 10;
      return `moveSprite(${steps});\n`;
    };
    Blockly.JavaScript['turn_right'] = b=>{
      const deg = Blockly.JavaScript.valueToCode(b,'DEG',Blockly.JavaScript.ORDER_ATOMIC) || 15;
      return `turnSprite(${deg});\n`;
    };
    Blockly.JavaScript['point_direction'] = b=>{
      const d = Blockly.JavaScript.valueToCode(b,'DIR',Blockly.JavaScript.ORDER_ATOMIC) || 90;
      return `pointInDirection(${d});\n`;
    };
    Blockly.JavaScript['say_text'] = b=>{
      const t = Blockly.JavaScript.valueToCode(b,'TEXT',Blockly.JavaScript.ORDER_ATOMIC) || '""';
      return `say(${t});\n`;
    };
    Blockly.JavaScript['set_visible'] = b=>{
      const vis = b.getFieldValue('VIS') === 'TRUE';
      return `setVisible(${vis});\n`;
    };
  }

  // register flag handlers
  function registerFlagHandler(fn){ flagHandlers.push(fn); }

  // Core sprite operations used by generated code
  window.registerFlagHandler = registerFlagHandler;
  window.moveSprite = function(steps){
    if(selectedIndex==null) return;
    const s = sprites[selectedIndex];
    const angleRad = (s.dir - 90) * Math.PI/180;
    s.x += steps * Math.cos(angleRad);
    s.y += steps * Math.sin(angleRad);
    drawAll();
  };
  window.turnSprite = function(deg){
    if(selectedIndex==null) return;
    sprites[selectedIndex].dir = (sprites[selectedIndex].dir + Number(deg)) % 360;
    drawAll();
  };
  window.pointInDirection = function(d){
    if(selectedIndex==null) return;
    sprites[selectedIndex].dir = Number(d);
    drawAll();
  };
  window.say = function(txt){
    if(selectedIndex==null) return;
    sprites[selectedIndex].say = String(txt).replace(/^["']|["']$/g,'');
    drawAll();
    setTimeout(()=>{ if(sprites[selectedIndex]) { delete sprites[selectedIndex].say; drawAll(); } },2000);
  };
  window.setVisible = function(v){
    if(selectedIndex==null) return;
    sprites[selectedIndex].visible = !!v;
    drawAll();
  };

  // draw/refresh
  function drawAll(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    for(let i=0;i<sprites.length;i++){
      const s = sprites[i];
      if(!s.visible) continue;
      ctx.save();
      ctx.translate(s.x,s.y);
      ctx.rotate((s.dir-90) * Math.PI/180);
      if(s.imageDataURL){
        const img = new Image();
        img.src = s.imageDataURL;
        ctx.drawImage(img,-25,-25,50,50);
      } else if(s.image){
        // support image object if existed from earlier code
        ctx.drawImage(s.image,-25,-25,50,50);
      } else {
        ctx.fillStyle = "#ff8800";
        ctx.beginPath(); ctx.arc(0,0,20,0,Math.PI*2); ctx.fill();
      }
      ctx.restore();

      if(s.say){
        ctx.font = "14px sans-serif";
        ctx.fillStyle = "#000";
        ctx.fillText(s.say, s.x-20, s.y-35);
      }
    }
  }

  // sprite list UI
  function refreshSpriteSelect(){
    spriteSelect.innerHTML='';
    sprites.forEach((s,i)=>{
      const o = document.createElement('option'); o.value = i; o.textContent = s.name || ('Sprite '+(i+1));
      spriteSelect.appendChild(o);
    });
    if(selectedIndex==null && sprites.length) selectedIndex = 0;
    spriteSelect.value = selectedIndex;
    updateProjectUrlDisplay();
  }
  spriteSelect.addEventListener('change', ()=> { selectedIndex = Number(spriteSelect.value); });

  // add/delete/draw
  addBtn.addEventListener('click', addSprite);
  delBtn.addEventListener('click', ()=> {
    if(selectedIndex==null) return;
    sprites.splice(selectedIndex,1);
    selectedIndex = sprites.length ? 0 : null;
    refreshSpriteSelect(); drawAll();
  });

  function addSprite(){
    const idx = sprites.length + 1;
    sprites.push({name:'Sprite '+idx, x:320, y:240, dir:90, visible:true});
    selectedIndex = sprites.length-1;
    refreshSpriteSelect();
    drawAll();
    // create project URL the first time a sprite is added (if not set)
    if(!projectId){ projectId = randId(6); projectUrl = `https://jergan-extra/${projectId}/.vercel.app/`; updateProjectUrlDisplay(); alert('Project created at: ' + projectUrl); }
  }

  // drawing tool
  openDraw.addEventListener('click', ()=>{
    drawModal.style.display = 'flex';
    drawCtx.clearRect(0,0,drawCanvas.width,drawCanvas.height);
    // white bg
    drawCtx.fillStyle = '#fff'; drawCtx.fillRect(0,0,drawCanvas.width,drawCanvas.height);
  });

  let drawing=false;
  drawCanvas.addEventListener('mousedown', e=>{ drawing=true; drawCtx.beginPath(); drawCtx.moveTo(e.offsetX,e.offsetY); });
  drawCanvas.addEventListener('mousemove', e=>{ if(!drawing) return; drawCtx.strokeStyle = document.getElementById('colorPicker').value; drawCtx.lineWidth=4; drawCtx.lineTo(e.offsetX,e.offsetY); drawCtx.stroke();});
  drawCanvas.addEventListener('mouseup', ()=> drawing=false);

  function imageToDataURL(img){
    const tmp = document.createElement('canvas'); tmp.width=img.width; tmp.height=img.height;
    const tctx = tmp.getContext('2d'); tctx.drawImage(img,0,0);
    return tmp.toDataURL();
  }

  function saveDrawing(){
    const data = drawCanvas.toDataURL('image/png');
    const name = 'Sprite ' + (sprites.length+1);
    sprites.push({name, x:320, y:240, dir:90, visible:true, imageDataURL:data});
    selectedIndex = sprites.length-1;
    refreshSpriteSelect(); drawAll();
    drawModal.style.display='none';
    // ensure project id exists
    if(!projectId){ projectId = randId(6); projectUrl = `https://jergan-extra/${projectId}/.vercel.app/`; updateProjectUrlDisplay(); alert('Project created at: ' + projectUrl); }
  }

  // dragging
  canvas.addEventListener('mousedown', e=>{
    const r = canvas.getBoundingClientRect();
    const mx = e.clientX - r.left, my = e.clientY - r.top;
    for(let i=sprites.length-1;i>=0;i--){
      const s = sprites[i];
      if(Math.abs(mx - s.x) < 25 && Math.abs(my - s.y) < 25){
        dragIndex = i; selectedIndex = i; refreshSpriteSelect(); break;
      }
    }
  });
  canvas.addEventListener('mousemove', e=>{
    if(dragIndex==null) return;
    const r = canvas.getBoundingClientRect();
    sprites[dragIndex].x = e.clientX - r.left;
    sprites[dragIndex].y = e.clientY - r.top;
    drawAll();
  });
  window.addEventListener('mouseup', ()=> { dragIndex = null; });

  // code generation + run
  genBtn.addEventListener('click', ()=> {
    const code = Blockly.JavaScript.workspaceToCode(workspace);
    if(currentMode==='teen') scriptPre.style.display='block';
    scriptPre.textContent = code;
    alert('Code generated to panel (also shown if 13+).');
  });

  // register/execute flag handlers
  greenFlag.addEventListener('click', ()=> {
    // clear previous handlers then evaluate code which registers handlers
    flagHandlers = [];
    const code = Blockly.JavaScript.workspaceToCode(workspace);
    try {
      eval(code);
      // run handlers sequentially (not blocking)
      for(const fn of flagHandlers) {
        try { fn(); } catch(e){ console.error('flag handler', e); alert('Error in handler: '+e.message); }
      }
    } catch(e){ alert('Error evaluating code: '+e.message); }
  });

  runBtn.addEventListener('click', ()=> {
    try { const code = Blockly.JavaScript.workspaceToCode(workspace); eval(code); }
    catch(e){ alert('Runtime error: '+e.message); }
  });
  stopBtn.addEventListener('click', ()=> { if(runInterval) clearInterval(runInterval); });

  // SAVE / LOAD (cloud + fallback localStorage)
  function getProjectObject(){
    // store sprite minimal serializable data + blocks xml
    const spritesSerial = sprites.map(s => ({name:s.name,x:s.x,y:s.y,dir:s.dir,visible:!!s.visible,imageDataURL:s.imageDataURL||null}));
    const xml = Blockly.Xml.workspaceToDom(workspace);
    const xmlText = Blockly.Xml.domToText(xml);
    return { id: projectId, sprites: spritesSerial, blocks: xmlText };
  }

  async function saveToCloud(){
    const obj = getProjectObject();
    if(!obj.id){ projectId = randId(6); obj.id = projectId; projectUrl = `https://jergan-extra/${projectId}/.vercel.app/`; updateProjectUrlDisplay(); }
    // try cloud if configured
    if(CLOUD_API_BASE){
      try {
        const res = await fetch(`${CLOUD_API_BASE}/projects/${obj.id}`, {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify(obj)
        });
        if(!res.ok) throw new Error('Server returned '+res.status);
        alert('Saved to cloud (project id: '+obj.id+')');
        // also local fallback
        localStorage.setItem('jergan_'+obj.id, JSON.stringify(obj));
        return;
      } catch(err){
        console.warn('cloud save failed',err);
        alert('Cloud save failed, saved locally instead.');
      }
    }
    // local fallback
    localStorage.setItem('jergan_'+obj.id, JSON.stringify(obj));
    alert('Saved locally (no cloud configured). Project id: '+obj.id);
  }

  async function loadFromCloud(){
    if(!projectId) { projectId = prompt('Enter project id to load (or paste):') || projectId; }
    if(!projectId) return alert('No project id set.');
    let loaded = null;
    if(CLOUD_API_BASE){
      try {
        const res = await fetch(`${CLOUD_API_BASE}/projects/${projectId}`);
        if(res.ok){
          loaded = await res.json();
        } else {
          console.warn('cloud load failed',res.status);
        }
      } catch(e){
        console.warn('cloud load error',e);
      }
    }
    if(!loaded){
      const raw = localStorage.getItem('jergan_'+projectId);
      if(raw) loaded = JSON.parse(raw);
    }
    if(!loaded) return alert('No project found with id '+projectId);
    // restore
    sprites = (loaded.sprites || []).map(s=>({ ...s }));
    // restore blocks
    try {
      const dom = Blockly.Xml.textToDom(loaded.blocks);
      Blockly.Xml.domToWorkspace(dom, workspace);
    } catch(e){
      console.warn('blocks restore failed',e);
    }
    selectedIndex = sprites.length ? 0 : null;
    projectUrl = `https://jergan-extra/${projectId}/.vercel.app/`;
    updateProjectUrlDisplay();
    refreshSpriteSelect(); drawAll(); alert('Project loaded.');
  }

  // Save/Load UI hooks
  btnSaveCloud.addEventListener('click', saveToCloud);
  btnLoadCloud.addEventListener('click', ()=>{
    const idInput = prompt('Enter project id to load (leave blank to use current project id):', projectId||'');
    if(idInput) projectId = idInput;
    loadFromCloud();
  });

  // Import/export
  btnExport.addEventListener('click', ()=>{
    const obj = getProjectObject();
    const blob = new Blob([JSON.stringify(obj, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = (projectId||'jergan_project') + '.json';
    document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  });

  btnImport.addEventListener('click', ()=> importFile.click());
  importFile.addEventListener('change', e=>{
    const f = e.target.files[0]; if(!f) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const obj = JSON.parse(ev.target.result);
        // restore
        sprites = (obj.sprites || []).map(s=>({ ...s }));
        const dom = Blockly.Xml.textToDom(obj.blocks || '<xml></xml>');
        Blockly.Xml.domToWorkspace(dom, workspace);
        projectId = obj.id || projectId || randId(6);
        projectUrl = `https://jergan-extra/${projectId}/.vercel.app/`;
        refreshSpriteSelect(); drawAll(); updateProjectUrlDisplay();
        alert('Project imported.');
      } catch(err){ alert('Import failed: '+err.message); }
    };
    reader.readAsText(f);
  });

  // helpers
  function updateProjectUrlDisplay(){ document.getElementById('projectUrl').textContent = projectUrl||'—'; }

  // try restore last autosave
  (function tryRestore() {
    // look for last saved id in localStorage key 'jergan_last'
    const last = localStorage.getItem('jergan_last');
    if(last){
      try {
        const obj = JSON.parse(localStorage.getItem('jergan_'+last));
        if(obj){
          // ask user
          if(confirm('Restore last project "'+last+'" from local storage?')){
            projectId = obj.id || last;
            sprites = (obj.sprites || []).map(s=>({ ...s }));
            try { const dom = Blockly.Xml.textToDom(obj.blocks||'<xml></xml>'); initBlockly(); Blockly.Xml.domToWorkspace(dom, workspace); } catch(e){}
            updateProjectUrlDisplay(); refreshSpriteSelect(); drawAll();
          }
        }
      } catch(e){}
    }
  })();

  // autosave to local on changes
  setInterval(()=>{
    if(!projectId) return;
    const obj = getProjectObject();
    localStorage.setItem('jergan_'+projectId, JSON.stringify(obj));
    localStorage.setItem('jergan_last', projectId);
  }, 5000);

})();
</script>
</body>
</html>
