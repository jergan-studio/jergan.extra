<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Jergan.extra - Create and Code</title>
  <style>
    html, body {
      margin: 0; padding: 0; height: 100%;
      font-family: sans-serif; overflow: hidden;
    }
    #age-picker, #main-editor { display: none; height: 100%; }
    #age-picker {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
    }
    .btn { padding: 12px 20px; margin: 10px; font-size: 18px; cursor: pointer; }
    #main-container { display: flex; height: 100%; }
    #blocklyDiv { height: 100%; width: 55%; }
    #right-panel {
      width: 45%; display: flex; flex-direction: column;
      padding: 10px; box-sizing: border-box;
    }
    #stage {
      flex: 1; background: #bde0fe; border: 2px solid #333;
      border-radius: 8px; position: relative; overflow: hidden;
    }
    canvas { width: 100%; height: 100%; cursor: grab; }
    #sprite-controls {
      display: flex; gap: 10px; margin-top: 10px;
      justify-content: space-around;
    }
    button { padding: 8px 14px; cursor: pointer; border-radius: 8px; }
  </style>
  <script src="https://unpkg.com/blockly/blockly.min.js"></script>
</head>
<body>

<!-- Age Selector -->
<div id="age-picker">
  <h1>Welcome to Jergan.extra</h1>
  <p>Choose your mode:</p>
  <button class="btn" onclick="startMode('young')">I'm under 13 (Blocks only)</button>
  <button class="btn" onclick="startMode('teen')">I'm 13 or older (Blocks + Script)</button>
</div>

<!-- Main Editor -->
<div id="main-editor">
  <div id="main-container">
    <div id="blocklyDiv"></div>
    <div id="right-panel">
      <canvas id="stage" width="480" height="360"></canvas>
      <div id="sprite-controls">
        <button onclick="addSprite()">Add Sprite</button>
        <button onclick="deleteSprite()">Delete Sprite</button>
        <button onclick="drawSprite()">Draw Sprite</button>
        <select id="spriteSelect"></select>
      </div>
      <button onclick="generateCode()">Generate Code</button>
      <button onclick="runCode()">Run</button>
      <button onclick="stopCode()">Stop</button>
      <pre id="script-editor" style="display:none; background:#f0f0f0; height:200px; overflow:auto;"></pre>
    </div>
  </div>
</div>

<script>
window.addEventListener("DOMContentLoaded", () => {
  let workspace, interpreter, currentMode = "young", runTimer;
  const canvas = document.getElementById("stage");
  const ctx = canvas.getContext("2d");
  const sprites = [];
  let selectedSprite = null;
  let projectId = null, projectUrl = null;

  function startMode(mode) {
    currentMode = mode;
    document.getElementById("age-picker").style.display = "none";
    document.getElementById("main-editor").style.display = "block";
    initBlockly();
    initStarterSprite();
  }

  // 🧩 Starter sprite (Scratch profile)
  function initStarterSprite() {
    const starter = new Image();
    starter.src = "https://uploads.scratch.mit.edu/users/avatars/jergan-studio.png";
    starter.onload = () => {
      const sprite = { name: "Jergan", x: 200, y: 150, dir: 90, visible: true, image: starter };
      sprites.push(sprite);
      selectedSprite = sprite;
      if (!projectId) {
        projectId = Math.random().toString(36).substring(2, 8);
        projectUrl = `https://jergan-extra/${projectId}/.vercel.app/`;
